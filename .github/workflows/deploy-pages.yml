name: Publish Three Nails Planner
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare local city backgrounds
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=80' --output assets/city-day.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=2000&q=80' --output assets/city-night.jpg
          test -s assets/city-day.jpg && test -s assets/city-night.jpg
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live cityscape image files
        shell: bash
        run: |
          site="https://evgyagovkina20072009.github.io/3-GVOZDYA-PUBLIC"
          for file in assets/city-day.jpg assets/city-night.jpg style.css index.html; do
            success=0
            for attempt in 1 2 3 4 5; do
              status=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 15 "$site/$file?verify=${GITHUB_SHA}" || true)
              echo "$file: HTTP $status (attempt $attempt)"
              if [ "$status" = "200" ]; then success=1; break; fi
              sleep 5
            done
            if [ "$success" != "1" ]; then
              echo "::error::$file isn't reachable at the published site"
              exit 1
            fi
          done
